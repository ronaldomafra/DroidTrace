[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droidtrace"
version = "0.1.0"
description = "Interactive Android logcat viewer with Codex-powered analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
droidtrace = "droidtrace.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
